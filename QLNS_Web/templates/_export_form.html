{% macro export_form(key, filters={}) -%}
    <form method="get"
          action="{{ url_for('export',key=key) }}"
          class="actions"
          style="display:flex;
                 align-items:center;
                 gap:8px">
        {% for name,value in filters.items() %}
            <input type="hidden" name="{{ name }}" value="{{ value }}">
        {% endfor %}
        <label for="export-format-{{ key }}"
               style="position:absolute;
                      width:1px;
                      height:1px;
                      padding:0;
                      margin:-1px;
                      overflow:hidden;
                      clip:rect(0,0,0,0);
                      white-space:nowrap;
                      border:0">Định dạng xuất</label>
        <select id="export-format-{{ key }}"
                name="format"
                aria-label="Chọn định dạng xuất"
                style="width:auto;
                       min-width:110px">
            <option value="csv">CSV</option>
            <option value="xlsx">Excel</option>
            <option value="pdf">PDF</option>
        </select>
        <button class="btn secondary" type="submit">↓　Xuất danh sách</button>
    </form>
{%- endmacro %}
