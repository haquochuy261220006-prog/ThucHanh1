{% extends "base.html" %}
{% block title %}Đổi mật khẩu · QLNS{% endblock %}
{% block content %}
    <div class="page-heading">
        <div>
            <span class="eyebrow blue">TÀI KHOẢN</span>
            <h1>Đổi mật khẩu</h1>
            <p>Mật khẩu mới dài từ 10 đến 256 ký tự; bạn cần nhập lại mật khẩu hiện tại.</p>
        </div>
    </div>
    <div class="panel narrow">
        <form method="post" class="data-form">
            <div class="field">
                <label for="current_password">Mật khẩu hiện tại</label>
                <input type="password"
                       id="current_password"
                       name="current_password"
                       autocomplete="current-password"
                       required
                       placeholder="Nhập mật khẩu hiện tại">
            </div>
            <div class="field">
                <label for="password">Mật khẩu mới</label>
                <div class="password-wrapper">
                    <input type="password"
                           id="password"
                           name="password"
                           minlength="10"
                           maxlength="256"
                           autocomplete="new-password"
                           required
                           placeholder="Nhập mật khẩu mới">
                    <button type="button"
                            class="password-toggle"
                            onclick="togglePassword()"
                            title="Hiện/ẩn mật khẩu">👁</button>
                </div>
            </div>
            <div class="form-actions">
                <button class="btn primary" type="submit">Lưu mật khẩu</button>
                <a class="btn secondary" href="{{ url_for('dashboard') }}">Quay lại</a>
            </div>
        </form>
    </div>
    <script>
        function togglePassword() {
            const password = document.getElementById("password");
            const button = document.querySelector(".password-toggle");

            if (password.type === "password") {
                password.type = "text";
                button.textContent = "🙈";
                button.title = "Ẩn mật khẩu";
            } else {
                password.type = "password";
                button.textContent = "👁";
                button.title = "Hiện mật khẩu";
            }
        }
    </script>
{% endblock %}
