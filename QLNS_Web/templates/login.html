{% extends 'base.html' %}{% block title %}Đăng nhập · QLNS{% endblock %}{% block public %}
<main class="login-wrap">
    <section class="login-card">
        <div class="login-brand">
            <span class="logo big">Q</span>
            <h1>QLNS</h1>
            <p>HỆ THỐNG QUẢN LÝ NHÂN SỰ</p>
        </div>
        <div class="login-form">
            <h2>Chào mừng trở lại</h2>
            <p class="muted">Đăng nhập để tiếp tục công việc của bạn.</p>
            <form method="post">
                <label>Tên đăng nhập</label>
                <input name="username" autocomplete="username" placeholder="Nhập tên đăng nhập" required autofocus>
                <label>Mật khẩu</label>
                <input type="password" name="password" autocomplete="current-password" placeholder="Nhập mật khẩu" required>
                <button class="btn primary full">Đăng nhập <span>→</span></button>
            </form>
            <p class="login-foot">Bảo mật · Nhanh chóng · Hiệu quả</p>
        </div>
    </section>
    <p class="copyright">@ 2026 Hệ thống quản lí nhân sự</p>
</main>{% endblock %}
